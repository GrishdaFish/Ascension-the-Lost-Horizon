#"light healing", upon item creation type will be added to the name.
#*/



[["consumable"]]
    name="light healing"
    cell='!'
    type="potion"
    min_effect=4 #min damage or turns the spell lasts
    max_effect=6
    max_stack=0 #unlimited stack size
    effect_type="heal" #spell to cast
    additional_effects="None" #additional effects like burning, freezing, slowing
    spell_effect="None" #graphical effect when item is used
    effect_color=[0, 0, 0] #use 0,0,0 for no color to the effect
    range=0 #range of spell, in cells
    radius=0 #how big of a radius of effects spells, like fireball
    max_targets=0 #0 for user/target, 1 for unlimited, or 2+ targets
    col=[255, 114, 114] #color of the item
    value=25
    stackable = true

    
