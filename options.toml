#options can and should be changed ingame

[game_options]
    fullscreen = false
    key_set = 'wasd'
    fps = 30

    [keys.wasd]
        key_north = "w"
        key_east = "d"
        key_south = "s"
        key_west = "a"
        key_inventory = "i"
        key_pickups = "g"
        key_equip = "e"
        key_help = "?"
        key_drop = "f"
        key_character = "c"

    [keys.arrows]
        key_north = "KEY_UP"
        key_east = "KEY_RIGHT"
        key_south = "KEY_DOWN"
        key_west = "KEY_LEFT"
        key_inventory = "i"
        key_pickups = "g"
        key_equip = "e"
        key_help = "?"
        key_drop = "f"
        key_character = "c"

